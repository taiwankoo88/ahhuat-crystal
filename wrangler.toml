# Cloudflare Pages 配置（阿发水晶阁）
name = "ahhuat-crystal"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

# ★ 这个文件带 pages_build_output_dir，所以 Cloudflare 以它为准：
#   控制台里的 Bindings 不生效，D1 必须写在这里（2026-11-12：缺了这段，线上 /api 全部返回 no-db）。
#   正式站和预览版都用同一个数据库。database_id 不是密码，可以公开。
[[d1_databases]]
binding = "DB"
database_name = "ahhuat"
database_id = "ae336ec9-7f56-4ef9-b0d7-780ff9045bb4"

# 密码类（ADMIN_PASSWORD、AUTH_SECRET）不要写进这个文件（仓库是公开的）：
#   在控制台 Settings → Variables and secrets 里加，类型选 Secret。
